[project]
name = "langgraph-multi-agents"

version = "0.1.0"

description = "A LangGraph-based multi-agent service with Ollama-first provider support."

readme = "README.md"

requires-python = ">=3.11"

dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "langgraph",
  "langchain-core",
  "langchain-ollama",
  "pydantic-settings",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "httpx",
  "ruff",
]

[build-system]
requires = ["setuptools>=68", "wheel"]

build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

target-version = "py311"
